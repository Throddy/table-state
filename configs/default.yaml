# Основной конфиг сборки. Меняет только роль A (раздел 5 контракта).
seed: 419

# Источники детекций и признаков строк, участвующие в сборке.
# dets: prod или имя файла artifacts/dets/<source>__v<N> без расширения; rowfeats: artifacts/rowfeats/<source>__v<N>.
sources:
  dets: [prod]
  rowfeats: []

slots:
  edges: [0, 275, 450, 690, 925, 1140, 1300]

# Зоны стола (раздел 9.1). Доли от ширины w и высоты h рамки стола.
zones:
  top:  {left: 0.08, right: 0.08, up: 0.08, down: 0.08}
  seat: {left: 0.45, right: 0.45, up: 1.10, down: 0.90}
  wide: {left: 0.45, right: 0.45, up: 1.10, down: 0.90}   # seat, обрезанная по кадру
  # Единственное место для параметров, зависящих от слота (слоты 1 и 6). Пока пусто.
  slot_overrides: {}

crops:
  narrow: {kind: top, scale: 4.0}
  wide:   {kind: wide, scale: 2.5}

rows:
  ir_saturation_threshold: 0.05   # is_ir = 1, если средняя насыщенность HSV ниже порога

# Привязка объектов к столам (раздел 9, ts.assign).
assign:
  small:
    hand_max_above: 0.05       # центр кисти не выше y1 - 0.05h
    bag_min_share: 0.60        # доля площади bag / personal_item внутри зоны top
    dedup_iou: 0.5
    dedup_small_px: 40.0
    dedup_center_ratio: 0.5
    negative_iou: 0.5
  people:
    min_table_overlap: 0.15    # пересечение / площадь стола, правило бейзлайна организаторов
    rescue_min: 0.25           # добор сидящих за дальней стороной: доля нижней трети бокса в зоне top

# Фильтры и контекст (раздел 10, ts.temporal).
temporal:
  min_conf: {}                 # {counter: порог} или {source: {counter: порог}}
  people_max_area: 45000       # px²; крупнее = идущий или стоящий в проходе. Подгоняется на train (ts.stack.tune_people_area)
  people_rescue: true
  # исключения из фильтра площади; на train не срабатывают, выключены (см. experiments/LOG_core.md)
  people_big_keep_with_hand: false
  people_big_keep_persistent: false

# Стекер (раздел 11, ts.stack).
stack:
  source: all                  # объединённый список объектов всех источников из sources.dets
  # cur = текущий кадр, med = правило раздела 10. Для cups med на train хуже на 1 строку, поэтому пока cur.
  counts: {people: cur, hands: cur, cups: cur, dishes: cur, items: null}
  people_fill: true            # people из соседей, если сейчас 0, у соседей одинаково и есть руки
  tune_people_area: true
  tune_conf: true              # пороги confidence источников, кроме prod: по одному на (источник, счётчик)
  # голосование с признаками строк: {counter: {column: vlm_qwen__items, mode: median | replace | max}}
  vote: {}
  occ_C: 1.0

# Постобработка (раздел 11.3). Каждое правило включается отдельно после проверки по 12.3.
post:
  hands_need_people: false
  hands_cap: false
  round_counts: false
  clip: true
  empty_night: false
  items_prior: true            # people >= 1 и items = 0 -> items = 1, пока источников items нет
  items_prior_floor: false     # приор как нижняя граница при наличии источников items; включать после проверки 12.3
