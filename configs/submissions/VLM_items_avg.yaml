# VLM_items_avg: VLM_items, где items = 0.5 × items COMBO + 0.5 × items VLM, без округления.
# Основной конфиг сборки. Меняет только роль A (раздел 5 контракта).
seed: 419

# Источники детекций и признаков строк, участвующие в сборке.
# dets: prod или имя файла artifacts/dets/<source>__v<N> без расширения; rowfeats: artifacts/rowfeats/<source>__v<N>.
sources:
  dets: [prod, ft_yolo__v1]
  rowfeats: [ov_counts__v1, vlm_qwen__v1]
  counters: {ft_yolo__v1: [hands]}     # от ft_yolo берутся только руки

slots:
  edges: [0, 275, 450, 690, 925, 1140, 1300]

# Зоны стола (раздел 9.1). Доли от ширины w и высоты h рамки стола.
zones:
  top:  {left: 0.08, right: 0.08, up: 0.08, down: 0.08}
  seat: {left: 0.45, right: 0.45, up: 1.10, down: 0.90}
  wide: {left: 0.45, right: 0.45, up: 1.10, down: 0.90}   # seat, обрезанная по кадру
  # Единственное место для параметров, зависящих от слота (слоты 1 и 6). Пока пусто.
  slot_overrides: {}

crops:
  narrow: {kind: top, scale: 4.0}
  wide:   {kind: wide, scale: 2.5}

rows:
  ir_saturation_threshold: 0.05   # is_ir = 1, если средняя насыщенность HSV ниже порога

# Откуда берётся каждая колонка итогового предсказания (раздел 12.5: колонка меняется только после
# проверки заменой на Public). stack = своя сборка (ts.stack), baseline = бейзлайн организаторов
# (data/baseline.py, режим calibrated, подгоняется на тех же строках).
# Сборка COMBO: NB1 (Public 0.64519) + руки ft_yolo (AB_ft_hands_pp 0.65585) + вещи при согласии двух моделей
# трека C (OV_items_and_pp 0.66401) + посуда вне подносов от OWLv2 (OV_dishes_owl_max 0.67045).
compose:
  people: stack        # +0.035 к качеству people на Public (AB_people)
  hands: stack         # руки прод + ft_yolo v1, затем hands_need_people и hands_cap: +0.011 на Public
  cups: baseline
  dishes: stack        # max(2 × подносы, счёт посуды OWLv2): +0.025 на Public
  items: stack         # вещи, найденные обеими моделями трека C, только при people >= 1: +0.019 на Public
  occ_prob: baseline   # AP на Public одинаков (AB_occ), остаётся вариант бейзлайна

# Привязка объектов к столам (раздел 9, ts.assign).
assign:
  small:
    hand_max_above: 0.05       # центр кисти не выше y1 - 0.05h
    bag_min_share: 0.60        # доля площади bag / personal_item внутри зоны top
    dedup_iou: 0.5
    dedup_small_px: 40.0
    dedup_center_ratio: 0.5
    negative_iou: 0.5
  people:
    min_table_overlap: 0.15    # пересечение / площадь стола, правило бейзлайна организаторов
    rescue_min: 0.25           # добор сидящих за дальней стороной: доля нижней трети бокса в зоне top
    rescue_pick: horizontal    # при нескольких кандидатах: ближайшая по горизонтали рамка (share = большая доля, как в NB1)

# Фильтры и контекст (раздел 10, ts.temporal).
temporal:
  min_conf: {}                 # {counter: порог} или {source: {counter: порог}}
  people_max_area: null        # фильтр площади бокса person выключен: на Public он вреден (R1b 0.580 против R1c 0.600)
  people_rescue: true
  # исключения из фильтра площади; на train не срабатывают, выключены (см. experiments/LOG_core.md)
  people_big_keep_with_hand: false
  people_big_keep_persistent: false
  # тарелка или миска на подносе (IoU >= порога или центр внутри бокса подноса) и миска-чашка в dishes не идут:
  # поднос уже считается с множителем post.tray_mult
  bowl_overlap_iou: 0.3

# Стекер (раздел 11, ts.stack).
stack:
  source: all                  # объединённый список объектов всех источников из sources.dets
  # cur = текущий кадр, med = правило раздела 10. Для cups med на train хуже на 1 строку, поэтому пока cur.
  counts: {people: cur, hands: cur, cups: cur, dishes: cur, items: cur}
  items_need_people: true      # items только при people >= 1 или при вещах на обоих соседних кадрах
  people_fill: true            # people из соседей, если сейчас 0, у соседей одинаково и есть руки
  tune_people_area: false      # порог площади не подбирается, см. temporal.people_max_area
  tune_conf: true              # пороги confidence источников, кроме prod: по одному на (источник, счётчик)
  # голосование с признаками строк: {counter: {column: vlm_qwen__items, mode: median | replace | max}}
  vote:
    items: {column: ov_counts__items_gdino_and_owl, mode: replace}
    dishes: {column: ov_counts__dishes_owl, mode: max}
  occ_C: 1.0

# Постобработка (раздел 11.3). Каждое правило включается отдельно после проверки по 12.3.
post:
  hands_need_people: true      # people = 0 -> hands = 0
  hands_cap: true              # hands <= 2 · people
  round_counts: false
  clip: true
  empty_night: false
  items_prior: false           # people >= 1 и items = 0 -> items = 1; на Public −0.003 против модели бейзлайна (AB_items)
  items_prior_floor: false     # приор как нижняя граница при наличии источников items; включать после проверки 12.3
  # dishes = тарелки + миски + tray_mult · подносы. Сейчас тарелок никто не детектирует, множитель 2
  # (подогнанный масштаб бейзлайна) даёт +0.26 к качеству dishes на Public (AB_dishes). Когда придут
  # детекции plate и bowl от трека C: добавить источник в sources.dets, поставить tray_mult: 1.0 и
  # сравнить заменой колонки; множитель остаётся запасным вариантом.
  tray_mult: 2.0               # проверено на Public: 1 даёт 0.598, 2 даёт 0.640–0.645, 3 даёт 0.603; вопрос закрыт

# Финальные замены колонок счётчиком VLM (Qwen3-VL-4B по широкому кропу стола, rowfeats vlm_qwen__v1).
# Применяются после постобработки; строка без ответа VLM (vlm_qwen__ok = 0) остаётся как в COMBO.
overrides:
  items: {column: vlm_qwen__items, mode: avg}
