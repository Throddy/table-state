# Обучение своего детектора v1 (задача B4). Запуск: python tracks/det/train.py --config tracks/det/configs/ft_yolo_v1.yaml ...
name: ft_yolo_v1
base_weights: yolo11m.pt      # COCO-веса из датасета ts-models, файл закреплён в tracks/det/fetch_weights.py
gray_p: 0.3                   # перевод батча в серый под ИК-кадры: указание роли A (в train 12 из 39 кадров ИК)

# Аргументы Ultralytics. Всё, чего здесь нет, остаётся по умолчанию библиотеки.
train:
  imgsz: 1024                 # B4: 960–1280 на кропах
  epochs: 30
  batch: 8
  seed: 419
  deterministic: true
  plots: false                # без сети и лишних файлов
  workers: 4
  # аугментации из B4
  scale: 0.5                  # масштаб ±50%
  hsv_v: 0.4                  # сдвиг яркости
  flipud: 0.0                 # без вертикального отражения
  # остальные аугментации: значения по умолчанию Ultralytics 8.4.211, записаны явно, чтобы их было видно
  hsv_h: 0.015
  hsv_s: 0.7
  translate: 0.1
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  cutmix: 0.0
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
